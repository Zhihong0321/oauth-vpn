<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GemShare</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<!-- Header -->
<header>
  <span class="logo">GemShare</span>
  <div class="tabs">
    <button class="tab active" id="tab-dash" onclick="showTab('dash')">Dashboard</button>
    <button class="tab" id="tab-admin" onclick="showTab('admin')">Admin</button>
  </div>
  <span id="app-version">v0.1.0</span>
</header>

<!-- ── DASHBOARD ─────────────────────────────────────────── -->
<div id="page-dash" class="page">

  <!-- Big connect toggle -->
  <div class="card connect-card" id="connect-card" onclick="toggleProxy()">
    <div id="connect-dot" class="dot"></div>
    <div>
      <div id="connect-label" class="connect-label">Disconnected</div>
      <div id="connect-sub" class="connect-sub">Click to connect — only Google traffic routed</div>
    </div>
  </div>

  <!-- Active profile -->
  <div class="card">
    <div class="card-title">Active Profile</div>
    <div class="row">
      <select id="profile-select" onchange="onProfileSelect()">
        <option value="">— No profiles yet —</option>
      </select>
      <div id="health-badge" class="badge grey">No cookies</div>
    </div>
    <div id="health-detail" class="hint"></div>
  </div>

  <!-- OTA -->
  <div class="card">
    <div class="card-title">App Updates</div>
    <div class="row">
      <span id="ota-label" class="hint">Checking…</span>
      <button id="btn-update" class="btn-sm hidden" onclick="doUpdate()">Install Update</button>
    </div>
  </div>

  <!-- Hub status -->
  <div class="card">
    <div class="card-title">Hub Status</div>
    <div id="hub-status" class="hint">Checking…</div>
  </div>

</div>

<!-- ── ADMIN ──────────────────────────────────────────────── -->
<div id="page-admin" class="page hidden">

  <div class="admin-header">
    <span class="card-title">Profiles</span>
    <button class="btn-primary" onclick="showForm()">+ New Profile</button>
  </div>

  <div id="profile-list"></div>

  <!-- Add / Edit form -->
  <div id="profile-form" class="card hidden">
    <div class="card-title" id="form-title">New Profile</div>
    <label>Label</label>
    <input id="form-label" type="text" placeholder="e.g. Team Account 1" />
    <label>Email</label>
    <input id="form-email" type="text" placeholder="user@gmail.com" />
    <label>Cookies <span class="hint">(Cookie-Editor → Export as JSON)</span></label>
    <textarea id="form-cookies" placeholder="Paste JSON here…"></textarea>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveProfile()">Save</button>
      <button class="btn-ghost" onclick="cancelForm()">Cancel</button>
    </div>
    <div id="form-msg"></div>
  </div>

</div>

<script src="/src/main.js"></script>
</body>
</html>
