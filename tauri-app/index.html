<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GemShare</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<header>
  <span class="logo">GemShare</span>
  <div id="hub-pill" class="pill grey">Hub checking…</div>
  <span id="app-version" class="version">v0.1.0</span>
</header>

<div id="main">

  <!-- Profile cards -->
  <div id="cards-section">
    <div class="section-header">
      <span class="section-title">Profiles</span>
      <button class="btn-add" onclick="showAddForm()">+ Add Profile</button>
    </div>
    <div id="card-list"></div>
  </div>

  <!-- Live log panel -->
  <div id="log-panel">
    <div class="section-header" style="margin-bottom:6px">
      <span class="section-title">Activity Log</span>
      <button class="btn-add" style="font-size:.7em;padding:3px 8px" onclick="clearLog()">Clear</button>
    </div>
    <div id="log-output"></div>
  </div>

  <!-- Add / Edit form (inline) -->
  <div id="profile-form" class="form-card hidden">
    <div class="form-title" id="form-title">New Profile</div>
    <label>Label</label>
    <input id="form-label" type="text" placeholder="e.g. Team Account 1" />
    <label>Email</label>
    <input id="form-email" type="text" placeholder="user@gmail.com" />
    <label>Session Cookies <span class="label-hint">— Cookie-Editor → Export as JSON</span></label>
    <textarea id="form-cookies" placeholder="Paste JSON here…"></textarea>
    <div class="form-actions">
      <button class="btn-primary" onclick="saveProfile()">Save</button>
      <button class="btn-ghost" onclick="hideForm()">Cancel</button>
    </div>
    <div id="form-msg"></div>
  </div>

</div>

<script src="/src/main.js"></script>
</body>
</html>
